# Phục vụ web tĩnh + reverse proxy /api sang service api (cùng origin → không cần CORS)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # File có hash trong tên → cache lâu dài
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Ảnh bìa do API phục vụ (đã có Cache-Control dài hạn)
  location /images/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  location /api/ {
    client_max_body_size 4m; # ảnh bìa (2 MB) / yêu cầu thu mua kèm ảnh (~3 MB)
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html =404;
  }
}
